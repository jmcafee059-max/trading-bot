[build]
builder = "nixpacks"

[deploy]
startCommand = "python api_server.py"

[env]
CAPITAL_PERCENTAGE = "100"
VOLATILITY_MULTIPLIER = "10"
SYMBOL = "AUTO"
STARTING_CAPITAL = "auto"
TAKE_PROFIT_PERCENT = "0.5"
TIMEFRAME = "1h"
RSI_PERIOD = "7"
RSI_OVERBOUGHT = "70"
RSI_OVERSOLD = "30"
STOP_LOSS_PERCENT = "0.3"
EMA_SHORT = "9"
EMA_LONG = "21"
SMA_PERIOD = "50"
VOLUME_THRESHOLD = "1.5"
MOMENTUM_PERIOD = "14"
MAX_POSITION_SIZE = "0.5"
MIN_CONFIDENCE_THRESHOLD = "0.1"
PROFIT_MULTIPLIER = "5.0"
AGGRESSIVE_MODE = "true"
ML_ENABLED = "true"
USE_ML_SIGNALS = "true"
ML_ONLY = "true"
OPENAI_ENABLED = "true"
ENABLE_COIN_SCANNER = "true"
SCAN_INTERVAL_MINUTES = "5"
MIN_EDGE_SCORE = "2.0"
MAX_PAIRS_TO_SCAN = "20"
