[build]
builder = "nixpacks"

[deploy]
startCommand = "python api_server.py"

[env]
# Simulates fills against real live prices with a fixed $100 balance -
# never places a real order. See simple_strategy_v2.py's paper_trading
# branches in place_buy_order/place_short_order/place_sell_order/
# place_cover_order. Set back to "false" to resume live trading.
PAPER_TRADING = "true"
PAPER_TRADING_BALANCE = "100"

CAPITAL_PERCENTAGE = "40"
VOLATILITY_MULTIPLIER = "10"
# Switched to NEAR-USDC. Note from the backtest: NEAR's strategy return
# (+44.56% over ~4mo) was mostly riding a genuine +134% buy-and-hold rally
# in that window, not a proven repeatable edge the way SOL's +9.22% was
# (achieved while SOL itself fell ~10%) - see conversation for the full
# comparison. Paper trading this is exactly how to find out if it holds up
# going forward.
SYMBOL = "NEAR-USDC"
STARTING_CAPITAL = "auto"
# Best combo from a 96-combination sweep against ~4 months of real 1h
# NEAR-USDC history: TP=1.5/SL=2.0/score>=25, +44.56% return, 253 trades,
# 59.3% win rate (63/64 qualifying combos were profitable - a robust
# result across parameter choices, not a one-off fluke). Replaces the
# previous SOL-tuned 0.5/0.5 override.
TAKE_PROFIT_PERCENT = "1.5"
TIMEFRAME = "1h"
RSI_PERIOD = "7"
RSI_OVERBOUGHT = "70"
RSI_OVERSOLD = "30"
STOP_LOSS_PERCENT = "2.0"
EMA_SHORT = "9"
EMA_LONG = "21"
SMA_PERIOD = "50"
VOLUME_THRESHOLD = "1.5"
MOMENTUM_PERIOD = "14"
# Raised from 0.5 - at the account's current small balance, Coinbase's $2
# minimum order size is a big enough fraction of total capital that a 50%
# cap made every trade size compute below the floor and get silently
# rejected. Lower this back down once the account balance grows enough that
# a smaller cap can still clear $2 per trade.
MAX_POSITION_SIZE = "0.95"
MIN_CONFIDENCE_THRESHOLD = "0.44"
PROFIT_MULTIPLIER = "5.0"
AGGRESSIVE_MODE = "true"
ML_ENABLED = "true"
USE_ML_SIGNALS = "true"
ML_ONLY = "true"
OPENAI_ENABLED = "true"
ENABLE_COIN_SCANNER = "true"
SCAN_INTERVAL_MINUTES = "5"
MIN_EDGE_SCORE = "2.0"
MAX_PAIRS_TO_SCAN = "20"

# Brought to parity with the locally-tuned .env profile - these were
# previously unset here, so they silently defaulted to off (or, for
# MIN_CONFIDENCE_THRESHOLD above, a much more permissive 0.1) even though
# the local config enables them for better trade quality and risk control.
# Temporarily off while debugging why the SOL short-setup code path stalls
# mid-evaluation (never reaches its own setup-score log line). Longs are
# unaffected by this and are the priority right now.
ENABLE_SHORT_TRADING = "false"

USE_SETUP_SCORE = "true"
# Unlike SOL/ETH (which use their own hardcoded setup-score gates that
# ignore this value entirely - see the SOL exit-logic fix earlier), NEAR
# has no such special case, so this generic gate genuinely governs its
# entries. Lowered to match the winning sweep combo's score_thresh=25.
MIN_SETUP_SCORE = "25"

USE_BTC_WEATHER = "true"
BTC_WEATHER_WEIGHT = "0.30"

USE_RELATIVE_STRENGTH = "true"
RELATIVE_STRENGTH_WEIGHT = "0.20"

USE_ADAPTIVE_CONFIDENCE = "true"
NORMAL_CONFIDENCE_THRESHOLD = "0.44"
STRONG_TREND_CONFIDENCE_THRESHOLD = "0.60"
CHOPPY_MARKET_CONFIDENCE_THRESHOLD = "0.78"

USE_TRADING_COST_MODEL = "true"
MAKER_FEE_PERCENT = "0.4"
TAKER_FEE_PERCENT = "0.6"
ESTIMATED_SPREAD_PERCENT = "0.02"
ESTIMATED_SLIPPAGE_PERCENT = "0.05"
MIN_EXPECTED_NET_PROFIT = "0.10"

# Off for now - these multipliers were tuned against TradeKit's ~0.05%
# backtest commission assumption, nowhere close to Coinbase spot's real
# ~1.1-1.4% round-trip cost, so the resulting dynamic TP targets were too
# small to ever pass the trading-cost gate. Using the fixed
# TAKE_PROFIT_PERCENT/STOP_LOSS_PERCENT above instead until ATR multipliers
# can be retuned against real Coinbase costs.
USE_ATR_TP_SL = "false"
ATR_TP_MULTIPLIER_LOW = "0.8"
ATR_TP_MULTIPLIER_NORMAL = "1.5"
ATR_TP_MULTIPLIER_HIGH = "2.0"
ATR_SL_MULTIPLIER = "1.0"
ATR_PERIOD = "14"

USE_PARTIAL_PROFIT_TAKING = "true"
FIRST_TP_PERCENT = "0.15"
SECOND_TP_PERCENT = "0.25"
THIRD_TP_PERCENT = "0.40"

USE_TRAILING_STOP = "true"
TRAILING_STOP_ACTIVATION_PCT = "0.15"
TRAILING_STOP_DISTANCE_PCT = "0.10"
USE_BREAKEVEN = "true"
BREAKEVEN_ACTIVATION_PCT = "0.20"
BREAKEVEN_OFFSET_PCT = "0.02"

# Real TradeKit (trader.dev) live signal webhook - see TRADEKIT_INTEGRATION.md.
# TRADEKIT_LIVE_SIGNALS stays false until explicitly confirmed.
# TRADEKIT_WEBHOOK_SECRET is deliberately NOT set here (this repo is public)
# - set it directly in the Railway dashboard's Variables tab, the same way
# API_KEY/SECRET_KEY already are.
TRADEKIT_LIVE_SIGNALS = "false"
TRADEKIT_MAX_SIGNAL_AGE_SECONDS = "900"
TRADEKIT_SIGNAL_BONUS = "8"
