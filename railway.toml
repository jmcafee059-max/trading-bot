[build]
builder = "nixpacks"

[deploy]
startCommand = "python api_server.py"
healthcheckPath = "/"
healthcheckTimeout = 300

[env]
CAPITAL_PERCENTAGE = "20"
VOLATILITY_MULTIPLIER = "5"
SYMBOL = "ETH-USDC"
STARTING_CAPITAL = "auto"
TAKE_PROFIT_PERCENT = "0.03"
TIMEFRAME = "1h"
RSI_PERIOD = "7"
RSI_OVERBOUGHT = "70"
RSI_OVERSOLD = "30"
STOP_LOSS_PERCENT = "0.1"
EMA_SHORT = "9"
EMA_LONG = "21"
SMA_PERIOD = "50"
VOLUME_THRESHOLD = "1.5"
MOMENTUM_PERIOD = "14"
MAX_POSITION_SIZE = "0.5"
MIN_CONFIDENCE_THRESHOLD = "0.3"
PROFIT_MULTIPLIER = "5.0"
AGGRESSIVE_MODE = "true"
ML_ENABLED = "true"
USE_ML_SIGNALS = "true"
ML_ONLY = "true"
OPENAI_ENABLED = "true"
