[build]
builder = "nixpacks"

[deploy]
startCommand = "python api_server.py"
healthcheckPath = "/"
healthcheckTimeout = 300

[env]
CAPITAL_PERCENTAGE = "20"
VOLATILITY_MULTIPLIER = "5"
SYMBOL = "AAVE-USDC"
STARTING_CAPITAL = "auto"
TAKE_PROFIT_PERCENT = "5"
TIMEFRAME = "1h"
RSI_PERIOD = "7"
RSI_OVERBOUGHT = "70"
RSI_OVERSOLD = "30"
STOP_LOSS_PERCENT = "2"
EMA_SHORT = "9"
EMA_LONG = "21"
SMA_PERIOD = "50"
VOLUME_THRESHOLD = "1.5"
MOMENTUM_PERIOD = "14"
